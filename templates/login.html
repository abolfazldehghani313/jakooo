{% extends 'base.html' %}{% block title %}ورود | جاکو{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><div class="auth-logo">جاکو <span>⌂</span></div><h1>خوش برگشتی 👋</h1><p class="auth-subtitle">نوع حساب خودت را انتخاب کن و وارد شو.</p><form method="post" class="form-stack"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><label>شماره موبایل یا ایمیل<input name="identifier" required placeholder="۰۹۱۲... یا example@email.com"></label><label>نوع حساب<select name="account_type" required><option value="guest">میهمان</option><option value="host">میزبان</option></select></label><label>رمز عبور<input type="password" name="password" required></label><button class="btn btn-primary full" type="submit">ورود به جاکو</button></form><p class="auth-bottom">حساب ندارید؟ <a href="{{ url_for('register') }}">ثبت‌نام کنید</a></p></div></section>{% endblock %}
